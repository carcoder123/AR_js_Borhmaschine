<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)" rx="24"/>
  <rect x="30" y="30" width="1540" height="940" fill="none" stroke="#00ff88" stroke-width="3" rx="18" opacity="0.35"/>

  <text x="800" y="118" font-family="Arial, sans-serif" font-size="84" font-weight="bold" fill="#00ff88" text-anchor="middle">Drehzahlregler</text>

  <!-- Seitenbeschriftung links: langsam -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="320" y="440" font-size="42" font-weight="bold" fill="#00ff88">LANGSAM (1–3)</text>
    <text x="320" y="492" font-size="32" fill="#c8c8d0">Metall, kleine</text>
    <text x="320" y="530" font-size="32" fill="#c8c8d0">Bohrungen</text>
  </g>
  <!-- Seitenbeschriftung rechts: schnell -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="1280" y="440" font-size="42" font-weight="bold" fill="#ff9f43">SCHNELL (7–10)</text>
    <text x="1280" y="492" font-size="32" fill="#c8c8d0">Holz, große</text>
    <text x="1280" y="530" font-size="32" fill="#c8c8d0">Bohrungen</text>
  </g>

  <!-- Drehschalter -->
  <g transform="translate(800,470)">
    <circle r="185" fill="#2a2a3a" stroke="#5a5a6a" stroke-width="5"/>
    <!-- Skalenstriche -->
    <g stroke="#8a8a9a" stroke-width="5" stroke-linecap="round">
      <line x1="-141" y1="51" x2="-174" y2="63"/>
      <line x1="-150" y1="-12" x2="-184" y2="-14"/>
      <line x1="-131" y1="-72" x2="-162" y2="-89"/>
      <line x1="-90" y1="-120" x2="-110" y2="-148"/>
      <line x1="-32" y1="-147" x2="-39" y2="-181"/>
      <line x1="32" y1="-147" x2="39" y2="-181"/>
      <line x1="90" y1="-120" x2="110" y2="-148"/>
      <line x1="131" y1="-72" x2="162" y2="-89"/>
      <line x1="150" y1="-12" x2="184" y2="-14"/>
      <line x1="141" y1="51" x2="174" y2="63"/>
    </g>
    <!-- Zeiger -->
    <line x1="0" y1="0" x2="-28" y2="-138" stroke="#e8e8f0" stroke-width="9" stroke-linecap="round"/>
    <circle r="26" fill="#3a3a4a" stroke="#00ff88" stroke-width="4"/>
  </g>

  <!-- Skalen-Zahlen (1–3 grün, 7–10 orange) -->
  <g font-family="Arial, sans-serif" font-size="46" font-weight="bold" text-anchor="middle">
    <text x="579" y="566" fill="#00ff88">1</text>
    <text x="566" y="468" fill="#00ff88">2</text>
    <text x="594" y="372" fill="#00ff88">3</text>
    <text x="660" y="298" fill="#e8e8f0">4</text>
    <text x="750" y="256" fill="#e8e8f0">5</text>
    <text x="850" y="256" fill="#e8e8f0">6</text>
    <text x="940" y="298" fill="#ff9f43">7</text>
    <text x="1006" y="372" fill="#ff9f43">8</text>
    <text x="1034" y="468" fill="#ff9f43">9</text>
    <text x="1021" y="566" fill="#ff9f43">10</text>
  </g>

  <text x="800" y="780" font-family="Arial, sans-serif" font-size="38" fill="#c8c8d0" text-anchor="middle">Ring auf gewünschte Zahl drehen</text>

  <!-- Schritte -->
  <g font-family="Arial, sans-serif" font-size="34">
    <g transform="translate(110,860)">
      <circle cx="34" cy="0" r="36" fill="#00ff88"/>
      <text x="34" y="13" font-size="38" font-weight="bold" fill="#16213e" text-anchor="middle">1</text>
      <text x="100" y="12" fill="#e8e8f0">Ring drehen</text>
    </g>
    <g transform="translate(640,860)">
      <circle cx="34" cy="0" r="36" fill="#00ff88"/>
      <text x="34" y="13" font-size="38" font-weight="bold" fill="#16213e" text-anchor="middle">2</text>
      <text x="100" y="12" fill="#e8e8f0">1–3 langsam (Metall)</text>
    </g>
    <g transform="translate(1090,860)">
      <circle cx="34" cy="0" r="36" fill="#00ff88"/>
      <text x="34" y="13" font-size="38" font-weight="bold" fill="#16213e" text-anchor="middle">3</text>
      <text x="100" y="12" fill="#e8e8f0">7–10 schnell (Holz)</text>
    </g>
  </g>
</svg>
