<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="16"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#00ff88" stroke-width="2" rx="12" opacity="0.3"/>
  
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#00ff88" text-anchor="middle">Drehzahlregler</text>
  
  <g transform="translate(400, 260)">
    <!-- Drehzahl-Skala -->
    <text x="0" y="-100" font-family="Arial" font-size="18" fill="#ff6b6b" text-anchor="middle">NIEDRIG</text>
    <text x="0" y="120" font-family="Arial" font-size="18" fill="#00ff88" text-anchor="middle">HOCH</text>
    <!-- Skala -->
    <line x1="-150" y1="-80" x2="150" y2="-80" stroke="#555" stroke-width="4"/>
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#555" stroke-width="4"/>
    <line x1="-150" y1="80" x2="150" y2="80" stroke="#555" stroke-width="4"/>
    <!-- Zahlen -->
    <text x="-150" y="-85" font-family="Arial" font-size="16" fill="#ff6b6b" text-anchor="middle">1</text>
    <text x="-75" y="-85" font-family="Arial" font-size="16" fill="#ffa726" text-anchor="middle">3</text>
    <text x="0" y="-85" font-family="Arial" font-size="16" fill="#ffeb3b" text-anchor="middle">5</text>
    <text x="75" y="-85" font-family="Arial" font-size="16" fill="#8bc34a" text-anchor="middle">7</text>
    <text x="150" y="-85" font-family="Arial" font-size="16" fill="#00ff88" text-anchor="middle">10</text>
    <!-- Regler-Knopf -->
    <circle cx="0" cy="0" r="40" fill="#3a3a4a" stroke="#00ff88" stroke-width="3"/>
    <circle cx="0" cy="0" r="15" fill="#00ff88" opacity="0.3"/>
    <line x1="0" y1="0" x2="30" y2="-30" stroke="#00ff88" stroke-width="3"/>
    <text x="50" y="-40" font-family="Arial" font-size="14" fill="#00ff88">Regler</text>
  </g>
  
  <g transform="translate(40, 430)">
    <text x="0" y="0" font-family="Arial" font-size="16" fill="#ccc">1. Ring mit Zahlenskala drehen</text>
    <text x="320" y="0" font-family="Arial" font-size="16" fill="#ccc">2. 1-3 = Metall / 7-10 = Holz</text>
    <text x="600" y="0" font-family="Arial" font-size="16" fill="#ccc">3. Einstellung prüfen</text>
  </g>
</svg>
