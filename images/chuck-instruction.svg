<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)" rx="24"/>
  <rect x="30" y="30" width="1540" height="940" fill="none" stroke="#00ff88" stroke-width="3" rx="18" opacity="0.35"/>

  <text x="800" y="118" font-family="Arial, sans-serif" font-size="84" font-weight="bold" fill="#00ff88" text-anchor="middle">Bohrfutter</text>
  <text x="800" y="182" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#00ff88" text-anchor="middle">GEGEN UHRZEIGERSINN DREHEN</text>

  <!-- Bohrfutter Frontansicht -->
  <g transform="translate(800,480)">
    <!-- Spannring (grün gestrichelt) -->
    <circle r="235" fill="none" stroke="#00ff88" stroke-width="7" stroke-dasharray="18,14"/>
    <!-- Dreh-Pfeilspitze oben, zeigt nach links -->
    <polygon points="-45,-235 25,-258 25,-212" fill="#00ff88"/>
    <!-- Gehäuse -->
    <circle r="185" fill="#33334a" stroke="#8a8a9a" stroke-width="5"/>
    <!-- Rändelung -->
    <g stroke="#6a6a7a" stroke-width="4">
      <line x1="0" y1="-185" x2="0" y2="-163"/>
      <line x1="0" y1="-185" x2="0" y2="-163" transform="rotate(45)"/>
      <line x1="0" y1="-185" x2="0" y2="-163" transform="rotate(90)"/>
      <line x1="0" y1="-185" x2="0" y2="-163" transform="rotate(135)"/>
      <line x1="0" y1="-185" x2="0" y2="-163" transform="rotate(180)"/>
      <line x1="0" y1="-185" x2="0" y2="-163" transform="rotate(225)"/>
      <line x1="0" y1="-185" x2="0" y2="-163" transform="rotate(270)"/>
      <line x1="0" y1="-185" x2="0" y2="-163" transform="rotate(315)"/>
    </g>
    <!-- Spannbacken -->
    <g fill="#4a4a5a" stroke="#6a6a7a" stroke-width="3">
      <rect x="-26" y="-150" width="52" height="66" rx="8"/>
      <rect x="-26" y="-150" width="52" height="66" rx="8" transform="rotate(120)"/>
      <rect x="-26" y="-150" width="52" height="66" rx="8" transform="rotate(240)"/>
    </g>
    <circle r="95" fill="#3a3a4a" stroke="#5a5a6a" stroke-width="4"/>
    <circle r="42" fill="#1a1a2e" stroke="#666666" stroke-width="3"/>
  </g>

  <!-- Bohrer von rechts einsetzen -->
  <g>
    <rect x="1150" y="458" width="190" height="44" rx="6" fill="#9a9aac"/>
    <polygon points="1150,458 1114,480 1150,502" fill="#c8c8d8"/>
    <line x1="1140" y1="480" x2="1080" y2="480" stroke="#00ff88" stroke-width="5" stroke-dasharray="10,8"/>
    <polygon points="1062,480 1090,466 1090,494" fill="#00ff88"/>
    <text x="1245" y="548" font-family="Arial, sans-serif" font-size="34" fill="#00ff88" text-anchor="middle">Bohrer einsetzen</text>
  </g>

  <!-- Schritte -->
  <g font-family="Arial, sans-serif" font-size="34">
    <g transform="translate(110,860)">
      <circle cx="34" cy="0" r="36" fill="#00ff88"/>
      <text x="34" y="13" font-size="38" font-weight="bold" fill="#16213e" text-anchor="middle">1</text>
      <text x="100" y="12" fill="#e8e8f0">Ring links drehen</text>
    </g>
    <g transform="translate(640,860)">
      <circle cx="34" cy="0" r="36" fill="#00ff88"/>
      <text x="34" y="13" font-size="38" font-weight="bold" fill="#16213e" text-anchor="middle">2</text>
      <text x="100" y="12" fill="#e8e8f0">Bohrer einsetzen</text>
    </g>
    <g transform="translate(1090,860)">
      <circle cx="34" cy="0" r="36" fill="#00ff88"/>
      <text x="34" y="13" font-size="38" font-weight="bold" fill="#16213e" text-anchor="middle">3</text>
      <text x="100" y="12" fill="#e8e8f0">Ring festziehen</text>
    </g>
  </g>
</svg>
