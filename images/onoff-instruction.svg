<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="16"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#00ff88" stroke-width="2" rx="12" opacity="0.3"/>
  
  <!-- Titel -->
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#00ff88" text-anchor="middle">Einschalter</text>
  
  <!-- Bohrmaschine Icon -->
  <g transform="translate(400, 260)">
    <!-- Körper -->
    <rect x="-120" y="-60" width="240" height="120" rx="12" fill="#3a3a4a" stroke="#555" stroke-width="2"/>
    <!-- Griff -->
    <rect x="-140" y="10" width="60" height="100" rx="8" fill="#2a2a3a" stroke="#555" stroke-width="2"/>
    <!-- Bohrer -->
    <rect x="100" y="-15" width="80" height="30" rx="4" fill="#888" stroke="#aaa" stroke-width="1"/>
    <polygon points="180,-15 210,0 180,15" fill="#aaa"/>
    <!-- Einschalter (rot) -->
    <rect x="-80" y="-30" width="30" height="60" rx="6" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="-65" y="30" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">ON</text>
    <!-- Pfeil zum Einschalter -->
    <line x1="-30" y1="0" x2="-65" y2="-30" stroke="#00ff88" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="-65,-30 -75,-40 -60,-35" fill="#00ff88"/>
  </g>
  
  <!-- Schritt-Anweisungen -->
  <g transform="translate(40, 430)">
    <text x="0" y="0" font-family="Arial" font-size="16" fill="#ccc">1. roten Einschalter finden</text>
    <text x="280" y="0" font-family="Arial" font-size="16" fill="#ccc">2. einmal drücken = Ein</text>
    <text x="560" y="0" font-family="Arial" font-size="16" fill="#ccc">3. gedrückt halten = Dauer</text>
  </g>
</svg>
