<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)" rx="24"/>
  <rect x="30" y="30" width="1540" height="940" fill="none" stroke="#00ff88" stroke-width="3" rx="18" opacity="0.35"/>

  <text x="800" y="118" font-family="Arial, sans-serif" font-size="84" font-weight="bold" fill="#00ff88" text-anchor="middle">Einschalter</text>

  <!-- Bohrmaschine Seitenansicht -->
  <g transform="translate(800,460)">
    <!-- Motorengehäuse -->
    <rect x="-260" y="-120" width="430" height="230" rx="28" fill="#3a3a4a" stroke="#5a5a6a" stroke-width="4"/>
    <!-- Lüftungsschlitze -->
    <g stroke="#26263a" stroke-width="10" stroke-linecap="round">
      <line x1="90" y1="-70" x2="90" y2="70"/>
      <line x1="120" y1="-70" x2="120" y2="70"/>
      <line x1="150" y1="-70" x2="150" y2="70"/>
    </g>
    <!-- Bohrfutter + Bohrer -->
    <rect x="170" y="-38" width="95" height="76" rx="10" fill="#4a4a5a" stroke="#6a6a7a" stroke-width="3"/>
    <rect x="265" y="-17" width="150" height="34" rx="4" fill="#9a9aac"/>
    <polygon points="415,-17 455,0 415,17" fill="#c8c8d8"/>
    <!-- Griff -->
    <rect x="-225" y="60" width="115" height="190" rx="22" fill="#2a2a3a" stroke="#5a5a6a" stroke-width="4"/>
    <!-- Akku -->
    <rect x="-195" y="255" width="155" height="72" rx="12" fill="#2f2f42" stroke="#5a5a6a" stroke-width="3"/>
    <!-- Einschalter (rot, hervorgehoben) -->
    <rect x="-192" y="92" width="52" height="112" rx="10" fill="#e74c3c" stroke="#ff7b6b" stroke-width="4" filter="url(#glow)"/>
    <text x="-166" y="160" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">ON</text>
    <circle cx="-166" cy="148" r="88" fill="none" stroke="#00ff88" stroke-width="5" stroke-dasharray="16,12"/>
    <!-- Hinweis-Pfeil -->
    <line x1="40" y1="30" x2="-62" y2="105" stroke="#00ff88" stroke-width="6" stroke-dasharray="14,10"/>
    <polygon points="-62,105 -88,112 -70,88" fill="#00ff88"/>
  </g>

  <!-- Schritte -->
  <g font-family="Arial, sans-serif" font-size="34">
    <g transform="translate(110,860)">
      <circle cx="34" cy="0" r="36" fill="#00ff88"/>
      <text x="34" y="13" font-size="38" font-weight="bold" fill="#16213e" text-anchor="middle">1</text>
      <text x="100" y="12" fill="#e8e8f0">Roten Schalter finden</text>
    </g>
    <g transform="translate(640,860)">
      <circle cx="34" cy="0" r="36" fill="#00ff88"/>
      <text x="34" y="13" font-size="38" font-weight="bold" fill="#16213e" text-anchor="middle">2</text>
      <text x="100" y="12" fill="#e8e8f0">Drücken = EIN</text>
    </g>
    <g transform="translate(1090,860)">
      <circle cx="34" cy="0" r="36" fill="#00ff88"/>
      <text x="34" y="13" font-size="38" font-weight="bold" fill="#16213e" text-anchor="middle">3</text>
      <text x="100" y="12" fill="#e8e8f0">Halten = Dauerbetrieb</text>
    </g>
  </g>
</svg>
