<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="16"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#00ff88" stroke-width="2" rx="12" opacity="0.3"/>
  
  <text x="400" y="70" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#00ff88" text-anchor="middle">Sägeguide / Tiefenanschlag</text>
  
  <g transform="translate(400, 260)">
    <!-- Sägeguide -->
    <rect x="-100" y="-100" width="200" height="200" rx="8" fill="none" stroke="#888" stroke-width="3"/>
    <rect x="-80" y="-80" width="160" height="160" rx="4" fill="#2a2a3a" stroke="#555" stroke-width="2"/>
    <!-- Tiefe-Markierungen -->
    <line x1="-80" y1="-40" x2="80" y2="-40" stroke="#00ff88" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#00ff88" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="-80" y1="40" x2="80" y2="40" stroke="#00ff88" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="-90" y="-35" font-family="Arial" font-size="12" fill="#00ff88">10mm</text>
    <text x="-90" y="5" font-family="Arial" font-size="12" fill="#00ff88">20mm</text>
    <text x="-90" y="45" font-family="Arial" font-size="12" fill="#00ff88">30mm</text>
    <!-- Verstell-Schraube -->
    <circle cx="80" cy="-80" r="12" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="80" y="-76" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle">LÖS</text>
    <!-- Pfeil -->
    <line x1="100" y1="-80" x2="130" y2="-80" stroke="#00ff88" stroke-width="2"/>
    <polygon points="130,-80 120,-85 120,-75" fill="#00ff88"/>
    <text x="135" y="-76" font-family="Arial" font-size="14" fill="#00ff88">Lösen</text>
  </g>
  
  <g transform="translate(40, 430)">
    <text x="0" y="0" font-family="Arial" font-size="16" fill="#ccc">1. Schraube am Guide lösen</text>
    <text x="280" y="0" font-family="Arial" font-size="16" fill="#ccc">2. Position für Bohrtiefe</text>
    <text x="560" y="0" font-family="Arial" font-size="16" fill="#ccc">3. Festziehen</text>
  </g>
</svg>
