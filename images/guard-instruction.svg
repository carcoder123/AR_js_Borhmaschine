<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)" rx="24"/>
  <rect x="30" y="30" width="1540" height="940" fill="none" stroke="#00ff88" stroke-width="3" rx="18" opacity="0.35"/>

  <text x="800" y="118" font-family="Arial, sans-serif" font-size="84" font-weight="bold" fill="#00ff88" text-anchor="middle">Sägeguide</text>
  <text x="800" y="176" font-family="Arial, sans-serif" font-size="40" fill="#c8c8d0" text-anchor="middle">Bohrtiefe einstellen (Tiefenanschlag)</text>

  <!-- Bohrmaschine mit Tiefenanschlag -->
  <g transform="translate(800,470)">
    <!-- Gehäuse -->
    <rect x="-180" y="-180" width="480" height="140" rx="26" fill="#3a3a4a" stroke="#5a5a6a" stroke-width="4"/>
    <!-- Lüftungsschlitze -->
    <g stroke="#26263a" stroke-width="10" stroke-linecap="round">
      <line x1="120" y1="-140" x2="120" y2="-80"/>
      <line x1="150" y1="-140" x2="150" y2="-80"/>
      <line x1="180" y1="-140" x2="180" y2="-80"/>
    </g>
    <!-- Griff -->
    <rect x="-40" y="-60" width="140" height="120" rx="16" fill="#2a2a3a" stroke="#5a5a6a" stroke-width="4"/>
    <!-- Akku -->
    <rect x="-25" y="65" width="110" height="60" rx="10" fill="#2f2f42" stroke="#5a5a6a" stroke-width="3"/>
    <!-- Bohrfutter (unten links, Bohrer zeigt nach unten) -->
    <rect x="-170" y="-40" width="95" height="75" rx="10" fill="#4a4a5a" stroke="#6a6a7a" stroke-width="3"/>
    <!-- Bohrer -->
    <rect x="-125" y="35" width="18" height="170" fill="#9a9aac"/>
    <polygon points="-125,205 -107,205 -116,237" fill="#c8c8d8"/>
    <!-- Führungsschiene mit Skala -->
    <rect x="-40" y="35" width="26" height="240" rx="4" fill="#8a8a9a" stroke="#aaaaaa" stroke-width="2"/>
    <g stroke="#4a4a5a" stroke-width="3">
      <line x1="-40" y1="70" x2="-22" y2="70"/>
      <line x1="-40" y1="100" x2="-22" y2="100"/>
      <line x1="-40" y1="130" x2="-22" y2="130"/>
      <line x1="-40" y1="160" x2="-22" y2="160"/>
      <line x1="-40" y1="190" x2="-22" y2="190"/>
      <line x1="-40" y1="220" x2="-22" y2="220"/>
      <line x1="-40" y1="250" x2="-22" y2="250"/>
    </g>
    <!-- Tiefenanschlag (grün, verstellbar) -->
    <rect x="-58" y="120" width="62" height="70" rx="10" fill="#00ff88" opacity="0.25" stroke="#00ff88" stroke-width="4"/>
    <!-- Feststellschraube -->
    <circle cx="34" cy="155" r="22" fill="#ff9f43" stroke="#e07b1f" stroke-width="3"/>
    <line x1="20" y1="155" x2="48" y2="155" stroke="#a35c10" stroke-width="4"/>
    <!-- Verstell-Pfeile (auf/ab) -->
    <line x1="120" y1="90" x2="120" y2="250" stroke="#00ff88" stroke-width="6" stroke-dasharray="14,10"/>
    <polygon points="120,64 106,96 134,96" fill="#00ff88"/>
    <polygon points="120,276 106,244 134,244" fill="#00ff88"/>
    <!-- Bohrtiefe-Markierung -->
    <line x1="-105" y1="245" x2="170" y2="245" stroke="#888888" stroke-width="3" stroke-dasharray="10,8"/>
    <text x="255" y="254" font-family="Arial, sans-serif" font-size="34" fill="#c8c8d0" text-anchor="start">Bohrtiefe</text>
  </g>

  <!-- Schritte -->
  <g font-family="Arial, sans-serif" font-size="34">
    <g transform="translate(110,860)">
      <circle cx="34" cy="0" r="36" fill="#00ff88"/>
      <text x="34" y="13" font-size="38" font-weight="bold" fill="#16213e" text-anchor="middle">1</text>
      <text x="100" y="12" fill="#e8e8f0">Schraube lösen</text>
    </g>
    <g transform="translate(640,860)">
      <circle cx="34" cy="0" r="36" fill="#00ff88"/>
      <text x="34" y="13" font-size="38" font-weight="bold" fill="#16213e" text-anchor="middle">2</text>
      <text x="100" y="12" fill="#e8e8f0">Tiefe einstellen</text>
    </g>
    <g transform="translate(1090,860)">
      <circle cx="34" cy="0" r="36" fill="#00ff88"/>
      <text x="34" y="13" font-size="38" font-weight="bold" fill="#16213e" text-anchor="middle">3</text>
      <text x="100" y="12" fill="#e8e8f0">Schraube festziehen</text>
    </g>
  </g>
</svg>
