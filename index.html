<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Bohrmaschine – AR Anleitung</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- AR.js – lokales Bundle (kein CDN, vermeidet CDN-Probleme auf Android) -->
  <script src="lib/aframe-ar.js"></script>
</head>
<body>

  <!-- Desktop-Hinweis -->
  <div id="desktop-hinweis">
    <h1>🔧 Bohrmaschine – AR Anleitung</h1>
    <p>Scanne einen der Barcode-Marker auf der Bohrmaschine mit deinem Smartphone.</p>
    <p class="small">Stelle sicher, dass du eine stabile Internetverbindung hast.</p>
    <div id="qr-section">
      <img src="qr/qr-code.png" alt="QR-Code" width="200"/>
      <p>QR-Code: Seite auf Smartphone öffnen</p>
    </div>
  </div>

  <!-- Ladebildschirm -->
  <div id="loading">
    <div class="spinner"></div>
    <p>AR wird geladen…</p>
    <p class="small">Kamera-Zugriff wird benötigt</p>
  </div>

  <!-- AR-Szene mit Barcode-Markern -->
  <!--
    Wichtig für Barcode-Marker (3x3_hamming_6_3):
    - detectionMode: mono_and_matrix (Matrix-/Barcode-Erkennung muss aktiv sein)
    - matrixCodeType: 3x3_HAMMING63 (passend zu den Markern aus der
      artoolkit-barcode-markers-collection, Ordner 3x3_hamming_6_3)
    - <a-marker type="barcode" value="N"> – die Barcode-Nummer wird über
      "value" angegeben, NICHT über "src" (src wird bei Barcodes ignoriert)

    Marker-Koordinaten: die gedruckte Markerfläche ist ca. 1x1 Einheiten,
    Mittelpunkt bei 0 0 0. Pro Marker (Reihenfolge der Kinder):
      1. Trackingrahmen  (Wireframe-Box auf der Markerfläche)
      2. Ring            (pulsierend, markiert die Stelle)
      3. 3D-Beacon       (schwebender Oktaeder, rotiert + bobbt)
      4. Anleitungspanel (PNG-Bild + Titel, über dem Marker)
  -->
  <a-scene
    embedded
    arjs="sourceType: webcam; sourceWidth: 640; sourceHeight: 480; displayWidth: 640; displayHeight: 480; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3_HAMMING63;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true"
  >

    <!-- ============ MARKER 1: EINSCHALTER (Barcode 0) ============ -->
    <a-marker type="barcode" value="0" id="marker-onoff" smooth="true" smooth-count="3">
      <a-box
        width="1" height="1" depth="0.004"
        position="0 0 0"
        material="wireframe: true; color: #00ff88; opacity: 0.45; transparent: true"
      ></a-box>
      <a-ring
        position="0 0 0.01"
        radius-inner="0.30"
        radius-outer="0.36"
        segments-theta="64"
        color="#00ff88"
        material="shader: flat; opacity: 0.9; transparent: true; side: double"
        animation="property: scale; from: 1 1 1; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 900; easing: easeInOutSine"
      ></a-ring>
      <a-entity
        position="0 0 0.3"
        animation="property: rotation; to: 360 360 0; loop: true; dur: 6000; easing: linear"
        animation__bob="property: position; from: 0 0 0.22; to: 0 0 0.38; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine"
      >
        <a-octahedron
          radius="0.12"
          color="#00ff88"
          material="opacity: 0.85; transparent: true; metalness: 0.2; roughness: 0.4"
        ></a-octahedron>
      </a-entity>
      <a-entity position="0 0.82 0">
        <a-box
          position="0 0 -0.005"
          width="0.84" height="0.54" depth="0.006"
          material="color: #1a1a2e; opacity: 0.92; transparent: true; side: double"
        ></a-box>
        <a-plane
          src="images/onoff-instruction.png"
          width="0.8"
          height="0.5"
          position="0 0 0.002"
          material="shader: flat; transparent: true; opacity: 0.97; side: double"
        ></a-plane>
        <a-text
          value="Einschalter"
          align="center"
          anchor="center"
          width="1"
          color="#00ff88"
          position="0 0.33 0.005"
        ></a-text>
      </a-entity>
    </a-marker>

    <!-- ============ MARKER 2: BOHRFUTTER (Barcode 1) ============ -->
    <a-marker type="barcode" value="1" id="marker-chuck" smooth="true" smooth-count="3">
      <a-box
        width="1" height="1" depth="0.004"
        position="0 0 0"
        material="wireframe: true; color: #00ff88; opacity: 0.45; transparent: true"
      ></a-box>
      <a-ring
        position="0 0 0.01"
        radius-inner="0.30"
        radius-outer="0.36"
        segments-theta="64"
        color="#00ff88"
        material="shader: flat; opacity: 0.9; transparent: true; side: double"
        animation="property: scale; from: 1 1 1; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 900; easing: easeInOutSine"
      ></a-ring>
      <a-entity
        position="0 0 0.3"
        animation="property: rotation; to: 360 360 0; loop: true; dur: 6000; easing: linear"
        animation__bob="property: position; from: 0 0 0.22; to: 0 0 0.38; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine"
      >
        <a-octahedron
          radius="0.12"
          color="#00ff88"
          material="opacity: 0.85; transparent: true; metalness: 0.2; roughness: 0.4"
        ></a-octahedron>
      </a-entity>
      <a-entity position="0 0.82 0">
        <a-box
          position="0 0 -0.005"
          width="0.84" height="0.54" depth="0.006"
          material="color: #1a1a2e; opacity: 0.92; transparent: true; side: double"
        ></a-box>
        <a-plane
          src="images/chuck-instruction.png"
          width="0.8"
          height="0.5"
          position="0 0 0.002"
          material="shader: flat; transparent: true; opacity: 0.97; side: double"
        ></a-plane>
        <a-text
          value="Bohrfutter"
          align="center"
          anchor="center"
          width="1"
          color="#00ff88"
          position="0 0.33 0.005"
        ></a-text>
      </a-entity>
    </a-marker>

    <!-- ============ MARKER 3: DREHZAHLREGELER (Barcode 2) ============ -->
    <a-marker type="barcode" value="2" id="marker-speed" smooth="true" smooth-count="3">
      <a-box
        width="1" height="1" depth="0.004"
        position="0 0 0"
        material="wireframe: true; color: #00ff88; opacity: 0.45; transparent: true"
      ></a-box>
      <a-ring
        position="0 0 0.01"
        radius-inner="0.30"
        radius-outer="0.36"
        segments-theta="64"
        color="#00ff88"
        material="shader: flat; opacity: 0.9; transparent: true; side: double"
        animation="property: scale; from: 1 1 1; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 900; easing: easeInOutSine"
      ></a-ring>
      <a-entity
        position="0 0 0.3"
        animation="property: rotation; to: 360 360 0; loop: true; dur: 6000; easing: linear"
        animation__bob="property: position; from: 0 0 0.22; to: 0 0 0.38; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine"
      >
        <a-octahedron
          radius="0.12"
          color="#00ff88"
          material="opacity: 0.85; transparent: true; metalness: 0.2; roughness: 0.4"
        ></a-octahedron>
      </a-entity>
      <a-entity position="0 0.82 0">
        <a-box
          position="0 0 -0.005"
          width="0.84" height="0.54" depth="0.006"
          material="color: #1a1a2e; opacity: 0.92; transparent: true; side: double"
        ></a-box>
        <a-plane
          src="images/speed-instruction.png"
          width="0.8"
          height="0.5"
          position="0 0 0.002"
          material="shader: flat; transparent: true; opacity: 0.97; side: double"
        ></a-plane>
        <a-text
          value="Drehzahlregler"
          align="center"
          anchor="center"
          width="1"
          color="#00ff88"
          position="0 0.33 0.005"
        ></a-text>
      </a-entity>
    </a-marker>

    <!-- ============ MARKER 4: SÄGEGUARD (Barcode 3) ============ -->
    <a-marker type="barcode" value="3" id="marker-guard" smooth="true" smooth-count="3">
      <a-box
        width="1" height="1" depth="0.004"
        position="0 0 0"
        material="wireframe: true; color: #00ff88; opacity: 0.45; transparent: true"
      ></a-box>
      <a-ring
        position="0 0 0.01"
        radius-inner="0.30"
        radius-outer="0.36"
        segments-theta="64"
        color="#00ff88"
        material="shader: flat; opacity: 0.9; transparent: true; side: double"
        animation="property: scale; from: 1 1 1; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 900; easing: easeInOutSine"
      ></a-ring>
      <a-entity
        position="0 0 0.3"
        animation="property: rotation; to: 360 360 0; loop: true; dur: 6000; easing: linear"
        animation__bob="property: position; from: 0 0 0.22; to: 0 0 0.38; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine"
      >
        <a-octahedron
          radius="0.12"
          color="#00ff88"
          material="opacity: 0.85; transparent: true; metalness: 0.2; roughness: 0.4"
        ></a-octahedron>
      </a-entity>
      <a-entity position="0 0.82 0">
        <a-box
          position="0 0 -0.005"
          width="0.84" height="0.54" depth="0.006"
          material="color: #1a1a2e; opacity: 0.92; transparent: true; side: double"
        ></a-box>
        <a-plane
          src="images/guard-instruction.png"
          width="0.8"
          height="0.5"
          position="0 0 0.002"
          material="shader: flat; transparent: true; opacity: 0.97; side: double"
        ></a-plane>
        <a-text
          value="Sägeguide"
          align="center"
          anchor="center"
          width="1"
          color="#00ff88"
          position="0 0.33 0.005"
        ></a-text>
      </a-entity>
    </a-marker>

    <!-- Kamera -->
    <a-entity camera></a-entity>

  </a-scene>

  <!-- Anweisungs-Overlay -->
  <div id="ar-overlay" class="ar-instruction hidden"></div>

  <script src="js/ar-instructions.js"></script>
</body>
</html>
